<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Autorisations — Dictopen</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f4f6; --card:#fff; --fg:#1c1c22; --muted:#6b6b76; --line:#e2e2e8; --accent:#2f6fed; --ok:#2a9d6a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1f24; --card:#27282f; --fg:#e8e8ee; --muted:#9a9ba6; --line:#383a44; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 13px/1.45 -apple-system, "SF Pro Text", Helvetica, sans-serif; padding:16px 18px; user-select:none; }
  h1 { font-size:15px; margin:0 0 4px; }
  p.intro { color:var(--muted); margin:0 0 12px; }
  .item { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .item .txt { flex:1; }
  .item b { display:block; margin-bottom:2px; }
  .item span { color:var(--muted); font-size:12px; }
  button { font:inherit; border:0; border-radius:7px; padding:6px 12px; background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
  button.secondary { background:var(--line); color:var(--fg); }
  .footer { display:flex; justify-content:flex-end; margin-top:6px; }
  .done { text-align:center; color:var(--ok); font-weight:600; padding:20px 0; }
</style>
</head>
<body>
  <h1>Autorisations nécessaires</h1>
  <p class="intro">Dictopen a besoin de ces droits macOS pour coller le texte dicté. Cette fenêtre se fermera d'elle-même quand tout sera accordé.</p>
  <div id="list"></div>
  <div class="footer"><button class="secondary" id="later">Plus tard</button></div>
<script>
(() => {
  const api = window.dictee;
  const ITEMS = {
    microphone: { title: 'Micro', hint: 'Réglages Système → Confidentialité et sécurité → Microphone → activer Dictopen.', pane: 'Privacy_Microphone' },
    accessibility: { title: 'Accessibilité', hint: 'Réglages Système → Confidentialité et sécurité → Accessibilité → activer Dictopen. S’il n’est pas dans la liste : bouton + puis choisir Dictopen dans Applications. S’il est déjà coché : décocher puis recocher.', pane: 'Privacy_Accessibility' },
    automation: { title: 'Automatisation (System Events)', hint: 'Réglages Système → Confidentialité et sécurité → Automatisation → Dictopen → System Events.', pane: 'Privacy_Automation' },
  };
  const list = document.getElementById('list');
  function render(st) {
    const missing = Object.keys(ITEMS).filter((k) => st[k] !== 'granted');
    if (!missing.length) { list.innerHTML = '<div class="done">Toutes les autorisations sont accordées.</div>'; return true; }
    list.innerHTML = missing.map((k) => `<div class="item"><div class="txt"><b>${ITEMS[k].title}</b><span>${ITEMS[k].hint}</span></div><button data-pane="${ITEMS[k].pane}">Ouvrir</button></div>`).join('');
    return false;
  }
  list.addEventListener('click', (e) => { const b = e.target.closest('button[data-pane]'); if (b) api.openPrivacyPane(b.dataset.pane); });
  document.getElementById('later').addEventListener('click', () => api.closePermissionsWindow());
  async function tick() {
    const st = await api.checkPermissions();
    if (render(st)) setTimeout(() => api.closePermissionsWindow(), 1200);
    else setTimeout(tick, 2000);
  }
  tick();
})();
</script>
</body>
</html>
